[project]
name = "rwb-case"
version = "0.1.0"
description = "Reproducible RWB shipment research and persistence baseline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "matplotlib==3.11.2",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "pywavelets>=1.10.0",
    "joblib>=1.6.0",
    "xgboost>=3.4.1",
    "optuna>=5.0.0",
    "scikit-learn>=1.9.1",
    "catboost>=1.2.10",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
]
